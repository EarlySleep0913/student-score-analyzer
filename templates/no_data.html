{% extends "base.html" %}

{% block title %}暂无数据{% endblock %}

{% block header %}暂无数据{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 24px;">
    <div style="font-size: 3.5em; margin-bottom: 20px; opacity: 0.15; font-family: var(--font-display); font-weight: 900;">空</div>
    <h2 style="margin-bottom: 12px; color: var(--text-secondary);">还没有考试数据</h2>
    <p style="color: var(--text-muted); margin-bottom: 28px;">导入成绩数据，或运行数据生成脚本</p>
    <div style="display: flex; gap: 12px; justify-content: center;">
        <a href="/import" class="btn btn-primary">导入数据</a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2>快速开始</h2>
    </div>
    <div class="grid-3">
        <div style="padding: 20px; background: var(--bg-surface); border-radius: var(--radius); border: 1px solid var(--border);">
            <div style="color: var(--amber); font-family: var(--font-display); font-weight: 700; font-size: 1.4em; margin-bottom: 8px;">01</div>
            <h3 style="margin-bottom: 8px; font-size: 0.95em;">准备数据</h3>
            <p style="color: var(--text-muted); font-size: 0.85em;">CSV 格式，GBK 编码</p>
        </div>
        <div style="padding: 20px; background: var(--bg-surface); border-radius: var(--radius); border: 1px solid var(--border);">
            <div style="color: var(--amber); font-family: var(--font-display); font-weight: 700; font-size: 1.4em; margin-bottom: 8px;">02</div>
            <h3 style="margin-bottom: 8px; font-size: 0.95em;">导入数据</h3>
            <p style="color: var(--text-muted); font-size: 0.85em;">填写考试信息并上传</p>
        </div>
        <div style="padding: 20px; background: var(--bg-surface); border-radius: var(--radius); border: 1px solid var(--border);">
            <div style="color: var(--amber); font-family: var(--font-display); font-weight: 700; font-size: 1.4em; margin-bottom: 8px;">03</div>
            <h3 style="margin-bottom: 8px; font-size: 0.95em;">查看分析</h3>
            <p style="color: var(--text-muted); font-size: 0.85em;">自动生成报告与图表</p>
        </div>
    </div>
</div>
{% endblock %}
